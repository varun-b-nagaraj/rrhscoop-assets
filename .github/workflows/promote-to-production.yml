# Promote to production: run from the Actions tab ("Run workflow").
# `main` is staging (the rrhscoop-staging Vercel project deploys it).
# This tests `main`, then moves the `production` branch up to it. The
# rrhscoop-assets Vercel project, which the store loads, deploys `production`.
name: Promote to production

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: promote-to-production

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Move production up to main
        run: |
          git fetch origin main production
          if ! git merge-base --is-ancestor origin/production origin/main; then
            echo "::error::production has commits that main doesn't. Bring them into main first: git checkout main && git merge origin/production && git push"
            exit 1
          fi
          if [ "$(git rev-parse origin/production)" = "$(git rev-parse origin/main)" ]; then
            echo "production is already the same as main. Nothing to promote."
            exit 0
          fi
          git push origin origin/main:refs/heads/production
          echo "Promoted $(git rev-parse --short origin/main) to production."
