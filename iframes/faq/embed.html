<!-- Paste this entire block into the RRHS CO-OP FAQ page. -->
<style>
  #rrhs-faq-frame {
    display: block;
    width: 100%;
    height: 6200px;
    border: 0;
    margin: 0;
    padding: 0;
    background: #f3ecdf;
    overflow: hidden;
  }
  @media (max-width: 760px) {
    #rrhs-faq-frame { height: 8200px; }
  }
</style>
<iframe
  id="rrhs-faq-frame"
  title="RRHS CO-OP Frequently Asked Questions"
  src="https://rrhscoop-assets.vercel.app/iframes/faq/index.html?v=1"
  scrolling="no"
  loading="eager"
  height="6200"
  onload="var f=this;if(!f.dataset.rrhsBridge){f.dataset.rrhsBridge='1';window.addEventListener('message',function(e){if(e.source!==f.contentWindow||!e.data)return;if(e.data.type==='rrhs-faq-height')f.style.height=Math.ceil(e.data.height)+'px';});}f.contentWindow.postMessage({type:'rrhs-faq-request-height'},'*');"
></iframe>
