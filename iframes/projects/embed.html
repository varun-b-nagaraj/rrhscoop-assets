<!-- Paste this entire block into the RRHS CO-OP Student Projects page. -->
<style>
  #rrhs-projects-frame { display:block;width:100%;height:6600px;border:0;margin:0;padding:0;background:#f3ecdf;overflow:hidden; }
  #rrhs-project-modal, #rrhs-project-modal * { box-sizing: border-box; }
  #rrhs-project-modal {
    position: fixed;
    z-index: 2147483000;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    visibility: hidden;
    opacity: 0;
    background: rgba(28,13,14,.76);
    backdrop-filter: blur(7px);
    transition: opacity .22s ease, visibility .22s ease;
  }
  #rrhs-project-modal.is-open { visibility: visible; opacity: 1; }
  #rrhs-project-modal .rpm-panel {
    position: relative;
    display: grid;
    grid-template-columns: minmax(300px,.82fr) minmax(420px,1.18fr);
    width: min(1080px,100%);
    max-height: calc(100vh - 48px);
    overflow: auto;
    color: #241a17;
    background: #fbf8f2;
    box-shadow: 0 30px 90px rgba(15,5,7,.35);
    transform: translateY(18px) scale(.985);
    transition: transform .28s ease;
  }
  #rrhs-project-modal.is-open .rpm-panel { transform: none; }
  #rrhs-project-modal .rpm-close {
    position: absolute;
    z-index: 3;
    top: 15px;
    right: 15px;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    color: #fff;
    background: #6e1f2a;
    font: 300 27px/1 Arial,sans-serif;
    cursor: pointer;
  }
  #rrhs-project-modal .rpm-visual { position: sticky; top: 0; min-height: 680px; background: #4d111c; }
  #rrhs-project-modal .rpm-visual img { width:100%;height:100%;min-height:680px;object-fit:cover;filter:saturate(.84); }
  #rrhs-project-modal .rpm-visual::after { content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(55,10,18,.42),transparent 50%);pointer-events:none; }
  #rrhs-project-modal .rpm-content { padding: 55px 52px 50px; font-family:"DM Sans",Arial,sans-serif; }
  #rrhs-project-modal .rpm-kicker { margin:0 0 14px;color:#6e1f2a;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase; }
  #rrhs-project-modal h2 { margin:0 45px 18px 0;font-family:"DM Serif Display",Georgia,serif;font-size:clamp(40px,4.2vw,62px);font-weight:400;line-height:.96;letter-spacing:-.035em; }
  #rrhs-project-modal .rpm-summary { margin:0 0 27px;color:#6f625d;font-family:Georgia,serif;font-size:17px;line-height:1.65; }
  #rrhs-project-modal .rpm-credit { margin:0 0 25px;padding:15px 17px;border-left:3px solid #6e1f2a;color:#3b2a26;background:#f3ecdf;font-size:12px;font-weight:700;line-height:1.55; }
  #rrhs-project-modal .rpm-metrics { display:grid;grid-template-columns:repeat(2,1fr);gap:1px;margin:0 0 28px;background:rgba(36,26,23,.13);border:1px solid rgba(36,26,23,.13); }
  #rrhs-project-modal .rpm-metric { padding:16px;background:#fff; }
  #rrhs-project-modal .rpm-metric strong { display:block;margin-bottom:3px;color:#6e1f2a;font-family:"DM Serif Display",Georgia,serif;font-size:29px;font-weight:400; }
  #rrhs-project-modal .rpm-metric span { color:#6f625d;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase; }
  #rrhs-project-modal h3 { margin:27px 0 12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase; }
  #rrhs-project-modal .rpm-overview { margin:0;color:#6f625d;font-size:13px;line-height:1.72; }
  #rrhs-project-modal ul { margin:0;padding:0;list-style:none;border-top:1px solid rgba(36,26,23,.13); }
  #rrhs-project-modal li { position:relative;padding:11px 0 11px 20px;border-bottom:1px solid rgba(36,26,23,.13);color:#554844;font-size:12px;line-height:1.55; }
  #rrhs-project-modal li::before { content:"→";position:absolute;left:0;color:#6e1f2a;font-weight:700; }
  #rrhs-project-modal .rpm-tags { display:flex;flex-wrap:wrap;gap:7px; }
  #rrhs-project-modal .rpm-tag { padding:7px 10px;border:1px solid rgba(110,31,42,.2);border-radius:999px;color:#6e1f2a;font-size:9px;font-weight:700;letter-spacing:.04em; }
  @media(max-width:760px){
    #rrhs-projects-frame{height:9800px;}
    #rrhs-project-modal{padding:10px;align-items:end;}
    #rrhs-project-modal .rpm-panel{display:block;max-height:calc(100vh - 20px);}
    #rrhs-project-modal .rpm-visual{position:relative;min-height:230px;height:230px;}
    #rrhs-project-modal .rpm-visual img{min-height:230px;height:230px;}
    #rrhs-project-modal .rpm-content{padding:30px 23px 34px;}
    #rrhs-project-modal h2{font-size:39px;}
  }
</style>
<iframe
  id="rrhs-projects-frame"
  title="RRHS CO-OP Student Projects"
  src="https://rrhscoop-assets.vercel.app/iframes/projects/index.html?v=3"
  scrolling="no"
  loading="eager"
  height="6600"
  onload="var f=this;if(!f.dataset.rrhsBridge){f.dataset.rrhsBridge='1';window.addEventListener('message',function(e){if(e.source!==f.contentWindow||!e.data)return;if(e.data.type==='rrhs-projects-height')f.style.height=Math.ceil(e.data.height)+'px';});}f.contentWindow.postMessage({type:'rrhs-projects-request-height'},'*');"
></iframe>

<div id="rrhs-project-modal" aria-hidden="true">
  <section class="rpm-panel" role="dialog" aria-modal="true" aria-labelledby="rpm-title">
    <button class="rpm-close" type="button" aria-label="Close project details">×</button>
    <div class="rpm-visual"><img src="" alt=""></div>
    <div class="rpm-content">
      <p class="rpm-kicker"></p>
      <h2 id="rpm-title"></h2>
      <p class="rpm-summary"></p>
      <p class="rpm-credit" hidden></p>
      <div class="rpm-metrics" hidden></div>
      <h3>Project overview</h3>
      <p class="rpm-overview"></p>
      <h3>What students built</h3>
      <ul class="rpm-highlights"></ul>
      <h3>Skills &amp; systems</h3>
      <div class="rpm-tags"></div>
    </div>
  </section>
</div>

<script>
  (function () {
    var frame = document.getElementById("rrhs-projects-frame");
    var modal = document.getElementById("rrhs-project-modal");
    var closeButton = modal.querySelector(".rpm-close");
    var lastFocus = null;
    var previousOverflow = "";

    function fillList(container, values, className) {
      container.textContent = "";
      values.forEach(function (value) {
        var element = document.createElement(className === "rpm-tag" ? "span" : "li");
        element.className = className || "";
        element.textContent = value;
        container.appendChild(element);
      });
    }

    function openProject(project) {
      lastFocus = document.activeElement;
      modal.querySelector(".rpm-visual img").src = project.image;
      modal.querySelector(".rpm-visual img").alt = project.imageAlt || "";
      modal.querySelector(".rpm-kicker").textContent = project.category + " · " + project.status;
      modal.querySelector("#rpm-title").textContent = project.title;
      modal.querySelector(".rpm-summary").textContent = project.summary;
      modal.querySelector(".rpm-overview").textContent = project.overview;

      var credit = modal.querySelector(".rpm-credit");
      credit.hidden = !project.credits;
      credit.textContent = project.credits || "";

      var metrics = modal.querySelector(".rpm-metrics");
      metrics.textContent = "";
      metrics.hidden = !project.metrics || !project.metrics.length;
      (project.metrics || []).forEach(function (metric) {
        var block = document.createElement("div");
        var value = document.createElement("strong");
        var label = document.createElement("span");
        block.className = "rpm-metric";
        value.textContent = metric.value;
        label.textContent = metric.label;
        block.appendChild(value);
        block.appendChild(label);
        metrics.appendChild(block);
      });

      fillList(modal.querySelector(".rpm-highlights"), project.highlights || [], "");
      fillList(modal.querySelector(".rpm-tags"), project.tags || [], "rpm-tag");
      previousOverflow = document.documentElement.style.overflow;
      document.documentElement.style.overflow = "hidden";
      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      window.setTimeout(function () { closeButton.focus(); }, 20);
    }

    function closeProject() {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      document.documentElement.style.overflow = previousOverflow;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    window.addEventListener("message", function (event) {
      if (event.source !== frame.contentWindow || !event.data) return;
      if (event.data.type === "rrhs-projects-height") frame.style.height = Math.ceil(event.data.height) + "px";
      if (event.data.type === "rrhs-project-open" && event.data.project) openProject(event.data.project);
    });
    closeButton.addEventListener("click", closeProject);
    modal.addEventListener("click", function (event) { if (event.target === modal) closeProject(); });
    document.addEventListener("keydown", function (event) { if (event.key === "Escape" && modal.classList.contains("is-open")) closeProject(); });
  }());
</script>
