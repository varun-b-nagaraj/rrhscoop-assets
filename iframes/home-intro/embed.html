<!-- Paste this entire block into the RRHS CO-OP page. -->
<div id="rrhs-home-intro-frames" style="width:100%;margin:0;padding:0;">
  <iframe
    id="rrhs-home-hero-frame"
    title="Built for Dragons"
    src="https://rrhscoop-assets.vercel.app/iframes/home-intro/hero.html?v=4"
    scrolling="no"
    loading="eager"
    height="770"
    style="display:block;width:100%;height:calc(100svh - 64px);border:0;margin:0;padding:0;background:#EEEAE0!important;overflow:hidden;"
  ></iframe>
  <iframe
    id="rrhs-home-categories-frame"
    title="Shop RRHS CO-OP categories"
    src="https://rrhscoop-assets.vercel.app/iframes/home-intro/categories.html?v=1"
    scrolling="no"
    loading="eager"
    height="810"
    style="display:block;width:100%;height:810px;border:0;margin:0;padding:0;background:#E7E1D4!important;overflow:hidden;"
  ></iframe>
</div>
<script>
  (function () {
    var hero = document.getElementById("rrhs-home-hero-frame");
    var categories = document.getElementById("rrhs-home-categories-frame");
    if (!hero || !categories) return;

    function sizeHeroToViewport() {
      var siteHeader = document.querySelector(".ins-header");
      var headerHeight = siteHeader ? siteHeader.getBoundingClientRect().height : 64;
      var viewportHeight = window.innerHeight || document.documentElement.clientHeight;
      var heroHeight = Math.max(1, Math.round(viewportHeight - headerHeight));
      hero.style.setProperty("height", heroHeight + "px", "important");
    }

    window.addEventListener("message", function (event) {
      if (!event.data) return;
      if (event.source === categories.contentWindow && event.data.type === "rrhs-home-categories-height") {
        categories.style.setProperty("height", Math.ceil(event.data.height) + "px", "important");
      }
    });

    hero.addEventListener("load", function () {
      sizeHeroToViewport();
    });
    categories.addEventListener("load", function () {
      categories.contentWindow.postMessage({ type: "rrhs-home-categories-request-height" }, "*");
    });

    window.addEventListener("resize", sizeHeroToViewport);
    sizeHeroToViewport();
  }());
</script>
