<div id="rrhs-stole-app"></div>

<style>
  #rrhs-stole-app {
    --maroon: #7c2d12;
    --maroon-dark: #5f220e;
    --ink: #111827;
    --muted: #64748b;
    --line: #e2e8f0;
    --bg: #f8fafc;
    font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 16px 28px;
  }
  #rrhs-stole-app .hero {
    background: linear-gradient(135deg, #ffffff 0%, #f5f7fb 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
  }
  #rrhs-stole-app .hero h2 { margin: 0 0 8px; font-size: 28px; }
  #rrhs-stole-app .hero p { margin: 0; color: var(--muted); }
  #rrhs-stole-app .login {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-top: 14px;
  }
  #rrhs-stole-app input[type="text"] {
    height: 46px; border: 1px solid #cbd5e1; border-radius: 12px; padding: 0 12px; font-size: 15px;
  }
  #rrhs-stole-app button {
    height: 46px; border: 0; border-radius: 12px; background: var(--maroon); color: #fff; font-weight: 700;
    padding: 0 16px; cursor: pointer;
  }
  #rrhs-stole-app button:hover { background: var(--maroon-dark); }
  #rrhs-stole-app button[disabled] { opacity: .45; cursor: not-allowed; }
  #rrhs-stole-app .status { margin: 10px 2px 0; min-height: 22px; color: #0f172a; }
  #rrhs-stole-app .status.error { color: #b91c1c; }
  #rrhs-stole-app .status.ok { color: #166534; }
  #rrhs-stole-app .layout {
    display: grid; grid-template-columns: 1fr 320px; gap: 16px; margin-top: 14px;
  }
  #rrhs-stole-app .panel {
    border: 1px solid var(--line); border-radius: 16px; background: #fff; overflow: hidden;
  }
  #rrhs-stole-app .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border-bottom: 1px solid var(--line); background: #fafafa;
  }
  #rrhs-stole-app .rows { padding: 8px; }
  #rrhs-stole-app .row {
    border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; background: #fff;
  }
  #rrhs-stole-app .row.locked { background: var(--bg); opacity: .75; }
  #rrhs-stole-app .row-head {
    display: grid; grid-template-columns: 22px 1fr auto auto; gap: 10px;
    align-items: center; padding: 10px 12px; cursor: pointer;
  }
  #rrhs-stole-app .row-head .name { font-weight: 700; }
  #rrhs-stole-app .row-head .price { color: #0f172a; font-weight: 700; }
  #rrhs-stole-app .badge {
    font-size: 11px; border-radius: 999px; padding: 3px 8px; border: 1px solid #d1d5db; color: #475569;
    background: #fff;
  }
  #rrhs-stole-app .badge.locked { border-color: #cbd5e1; color: #475569; background: #f1f5f9; }
  #rrhs-stole-app .chev { color: #64748b; font-weight: 700; }
  #rrhs-stole-app .row-body {
    max-height: 0; overflow: hidden; transition: max-height .25s ease; border-top: 1px solid transparent;
  }
  #rrhs-stole-app .row.open .row-body { max-height: 220px; border-top-color: var(--line); }
  #rrhs-stole-app .row-body-inner { padding: 10px 12px 12px; color: #334155; font-size: 14px; }
  #rrhs-stole-app .summary {
    padding: 14px;
    display: grid; gap: 10px;
  }
  #rrhs-stole-app .sum-line {
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
  }
  #rrhs-stole-app .sum-total { font-size: 22px; font-weight: 800; }
  #rrhs-stole-app .small { font-size: 12px; color: var(--muted); line-height: 1.4; }
  @media (max-width: 900px) {
    #rrhs-stole-app .layout { grid-template-columns: 1fr; }
  }
</style>

<script>
(function () {
  "use strict";

  // ---------------- CONFIG ----------------
  const CONFIG = {
    storeId: "104841648",
    apiToken: "REPLACE_WITH_TOKEN",
    apiBase: "https://app.ecwid.com/api/v3",
    categoryId: 169641234,
    excludedSkus: ["48_sku_main"],
    fallbackCatalog: [
      {
        id: 827486598,
        sku: "268_sku",
        name: "Graduation Stoles Business and Industry (Gold)",
        price: 20,
        url: "https://rrhscoop.roundrockisd.org/products/Graduation-Stoles-Business-and-Industry-Gold-p827486598",
        enabled: true
      },
      {
        id: 827484142,
        sku: "266_sku",
        name: "Graduation Stoles Visual and Performing Arts (Brown)",
        price: 20,
        url: "https://rrhscoop.roundrockisd.org/products/Graduation-Stoles-Visual-and-Performing-Arts-Brown-p827484142",
        enabled: true
      },
      {
        id: 827485118,
        sku: "267_sku",
        name: "Graduation Stoles STEM (Yellow)",
        price: 20,
        url: "https://rrhscoop.roundrockisd.org/products/Graduation-Stoles-STEM-Yellow-p827485118",
        enabled: true
      },
      {
        id: 827485119,
        sku: "269_sku",
        name: "Graduation Stoles Public Service (Blue)",
        price: 20,
        url: "https://rrhscoop.roundrockisd.org/products/Graduation-Stoles-Public-Service-Blue-p827485119",
        enabled: true
      },
      {
        id: 827487302,
        sku: "265_sku",
        name: "Graduation Stoles Health Science (Green)",
        price: 20,
        url: "https://rrhscoop.roundrockisd.org/products/Graduation-Stoles-Health-Science-Green-p827487302",
        enabled: true
      }
    ],
    // Add/maintain mappings here:
    assignments: {
      s151579: [
        {
          name: "Graduation Stoles Business and Industry (Gold)",
          description: "Business and Industry pathway stole in gold. Worn at graduation.",
          color: "Gold"
        },
        {
          name: "Graduation Stoles STEM (Yellow)",
          description: "STEM pathway stole in yellow. Worn at graduation.",
          color: "Yellow"
        }
      ]
    }
  };

  const root = document.getElementById("rrhs-stole-app");
  if (!root) return;

  const state = {
    catalog: [],
    catalogById: new Map(),
    catalogByName: new Map(),
    assigned: [],
    selectedIds: new Set(),
    lockedIds: new Set(),
    sNumber: "",
    syncing: false
  };

  function setCatalog(items) {
    const clean = (Array.isArray(items) ? items : []).filter((p) => {
      if (!p || p.enabled === false) return false;
      if (CONFIG.excludedSkus.includes(String(p.sku || "").trim())) return false;
      return true;
    });
    state.catalog = clean;
    state.catalogById = new Map(clean.map((p) => [Number(p.id), p]));
    state.catalogByName = new Map(clean.map((p) => [String(p.name || "").trim().toLowerCase(), p]));
  }

  root.innerHTML = `
    <section class="hero">
      <h2>Graduation Stoles</h2>
      <p>Enter your S-number to load your approved stoles. Select what you want, review totals, then add to cart.</p>
      <div class="login">
        <input id="rrhs-s-number" type="text" placeholder="s123456" autocomplete="off" />
        <button id="rrhs-login-btn" type="button">Continue</button>
      </div>
      <div id="rrhs-status" class="status"></div>
    </section>

    <section id="rrhs-main" style="display:none;">
      <div class="layout">
        <div class="panel">
          <div class="panel-head">
            <strong>Your Eligible Stoles</strong>
            <span id="rrhs-count" class="small"></span>
          </div>
          <div id="rrhs-rows" class="rows"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><strong>Order Summary</strong></div>
          <div class="summary">
            <div class="sum-line"><span>Selected items</span><strong id="rrhs-sel-count">0</strong></div>
            <div class="sum-line"><span>Estimated total</span><span class="sum-total" id="rrhs-total">$0.00</span></div>
            <button id="rrhs-add-btn" type="button" disabled>Add Selected To Cart</button>
            <div class="small">Items already in cart are locked. All stole quantities are enforced to 1 each.</div>
          </div>
        </div>
      </div>
    </section>
  `;

  const els = {
    input: root.querySelector("#rrhs-s-number"),
    loginBtn: root.querySelector("#rrhs-login-btn"),
    status: root.querySelector("#rrhs-status"),
    main: root.querySelector("#rrhs-main"),
    rows: root.querySelector("#rrhs-rows"),
    count: root.querySelector("#rrhs-count"),
    selCount: root.querySelector("#rrhs-sel-count"),
    total: root.querySelector("#rrhs-total"),
    addBtn: root.querySelector("#rrhs-add-btn")
  };

  function normalizeS(v) {
    const t = String(v || "").trim().toLowerCase().replace(/\s+/g, "");
    if (!t) return "";
    return t.startsWith("s") ? t : `s${t}`;
  }

  function setStatus(text, type) {
    els.status.textContent = text || "";
    els.status.className = `status ${type || ""}`.trim();
  }

  function money(n) {
    return `$${(Number(n || 0)).toFixed(2)}`;
  }

  function whenEcwidReady() {
    return new Promise((resolve, reject) => {
      const started = Date.now();
      const t = setInterval(() => {
        if (window.Ecwid && window.Ecwid.Cart) {
          clearInterval(t);
          resolve();
          return;
        }
        if (Date.now() - started > 10000) {
          clearInterval(t);
          reject(new Error("Ecwid storefront JS not found"));
        }
      }, 120);
    });
  }

  function ecwidGetCart() {
    return new Promise((resolve, reject) => {
      if (!window.Ecwid || !Ecwid.Cart || typeof Ecwid.Cart.get !== "function") {
        reject(new Error("Cart.get unavailable"));
        return;
      }
      Ecwid.Cart.get((cart) => resolve(cart || {}));
    });
  }

  function ecwidAddProduct(id, quantity) {
    return new Promise((resolve, reject) => {
      if (!window.Ecwid || !Ecwid.Cart || typeof Ecwid.Cart.addProduct !== "function") {
        reject(new Error("Cart.addProduct unavailable"));
        return;
      }
      Ecwid.Cart.addProduct({
        id,
        quantity,
        callback(success, product, cart, error) {
          if (!success) { reject(new Error(error || "addProduct failed")); return; }
          resolve({ product, cart });
        }
      });
    });
  }

  function ecwidRemoveIndex(index) {
    return new Promise((resolve, reject) => {
      if (!window.Ecwid || !Ecwid.Cart || typeof Ecwid.Cart.removeProduct !== "function") {
        reject(new Error("Cart.removeProduct unavailable"));
        return;
      }
      Ecwid.Cart.removeProduct(index, (success, qty, product, cart, error) => {
        if (!success) { reject(new Error(error || "removeProduct failed")); return; }
        resolve({ qty, product, cart });
      });
    });
  }

  async function fetchCatalog() {
    const hasUsableToken = Boolean(
      CONFIG.apiToken &&
      String(CONFIG.apiToken).trim() &&
      String(CONFIG.apiToken).trim() !== "REPLACE_WITH_TOKEN"
    );

    if (!hasUsableToken) {
      setCatalog(CONFIG.fallbackCatalog);
      return;
    }

    const url = `${CONFIG.apiBase}/${encodeURIComponent(CONFIG.storeId)}/products?category=${encodeURIComponent(CONFIG.categoryId)}&limit=100`;
    try {
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${CONFIG.apiToken}` },
        cache: "no-store"
      });
      if (!res.ok) throw new Error(`Catalog fetch failed: ${res.status}`);
      const json = await res.json();
      setCatalog(json.items || []);
      if (state.catalog.length) return;
      setCatalog(CONFIG.fallbackCatalog);
    } catch (_err) {
      setCatalog(CONFIG.fallbackCatalog);
    }
  }

  function resolveAssigned(sNumber) {
    const raw = CONFIG.assignments[sNumber] || [];
    const out = [];
    const seen = new Set();

    raw.forEach((entry) => {
      let p = null;
      let meta = { description: "", color: "" };

      if (typeof entry === "number") p = state.catalogById.get(Number(entry)) || null;
      if (typeof entry === "string") p = state.catalogByName.get(entry.trim().toLowerCase()) || null;

      if (entry && typeof entry === "object" && !Array.isArray(entry)) {
        const id = Number(entry.productId || entry.id || 0);
        if (id > 0) p = state.catalogById.get(id) || null;
        if (!p && entry.name) p = state.catalogByName.get(String(entry.name).trim().toLowerCase()) || null;
        meta.description = String(entry.description || "");
        meta.color = String(entry.color || "");
      }

      if (!p) return;
      if (seen.has(p.id)) return;
      seen.add(p.id);

      out.push({
        id: Number(p.id),
        name: String(p.name || ""),
        price: Number(p.price || 0),
        description: meta.description || "Official graduation stole approved for your pathway.",
        color: meta.color || "",
        url: String(p.url || "")
      });
    });

    return out;
  }

  async function readLockedFromCart() {
    const assignedIds = new Set(state.assigned.map((x) => x.id));
    const locked = new Set();
    const cart = await ecwidGetCart();
    const items = Array.isArray(cart.items) ? cart.items : [];
    items.forEach((it) => {
      const id = Number(it && it.product && it.product.id);
      const qty = Math.max(0, Number(it && it.quantity) || 0);
      if (qty > 0 && assignedIds.has(id)) locked.add(id);
    });
    state.lockedIds = locked;
  }

  function renderRows() {
    els.rows.innerHTML = "";
    els.count.textContent = `${state.assigned.length} item(s)`;
    state.selectedIds = new Set([...state.selectedIds].filter((id) => !state.lockedIds.has(id)));

    state.assigned.forEach((item, idx) => {
      const locked = state.lockedIds.has(item.id);
      const checked = locked || state.selectedIds.has(item.id);

      const row = document.createElement("article");
      row.className = `row ${locked ? "locked" : ""}`;
      row.innerHTML = `
        <div class="row-head" role="button" aria-expanded="false" tabindex="0">
          <input type="checkbox" ${checked ? "checked" : ""} ${locked ? "disabled" : ""} aria-label="Select ${item.name}" />
          <div class="name">${item.name}</div>
          <span class="badge ${locked ? "locked" : ""}">${locked ? "Already in cart" : "Eligible"}</span>
          <div class="price">${money(item.price)} <span class="chev">▾</span></div>
        </div>
        <div class="row-body">
          <div class="row-body-inner">
            <div><strong>Color:</strong> ${item.color || "Assigned by pathway"}</div>
            <div style="margin-top:6px;">${item.description}</div>
            ${item.url ? `<div style="margin-top:8px;"><a href="${item.url}" target="_blank" rel="noopener">View product page</a></div>` : ""}
          </div>
        </div>
      `;

      const head = row.querySelector(".row-head");
      const body = row.querySelector(".row-body");
      const cb = row.querySelector('input[type="checkbox"]');

      function toggleOpen(force) {
        const open = typeof force === "boolean" ? force : !row.classList.contains("open");
        row.classList.toggle("open", open);
        head.setAttribute("aria-expanded", open ? "true" : "false");
      }

      head.addEventListener("click", (e) => {
        if (e.target === cb) return;
        toggleOpen();
      });

      head.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleOpen();
        }
      });

      cb.addEventListener("change", () => {
        if (cb.checked) state.selectedIds.add(item.id);
        else state.selectedIds.delete(item.id);
        updateSummary();
      });

      if (idx === 0) toggleOpen(true);
      els.rows.appendChild(row);
    });

    updateSummary();
  }

  function updateSummary() {
    const selected = state.assigned.filter((x) => state.selectedIds.has(x.id) && !state.lockedIds.has(x.id));
    const total = selected.reduce((s, x) => s + Number(x.price || 0), 0);
    els.selCount.textContent = String(selected.length);
    els.total.textContent = money(total);
    els.addBtn.disabled = selected.length === 0;
  }

  async function enforceCartRules() {
    if (state.syncing) return;
    state.syncing = true;
    try {
      const allowed = new Set(state.assigned.map((x) => x.id));
      const cart = await ecwidGetCart();
      const items = Array.isArray(cart.items) ? cart.items : [];
      const byId = new Map();
      const removeIndexes = [];

      items.forEach((it, idx) => {
        const id = Number(it && it.product && it.product.id);
        const qty = Math.max(0, Number(it && it.quantity) || 0);
        if (!state.catalogById.has(id)) return;
        if (!allowed.has(id)) { removeIndexes.push(idx); return; }
        const prev = byId.get(id) || { total: 0, indexes: [] };
        prev.total += qty;
        prev.indexes.push(idx);
        byId.set(id, prev);
      });

      byId.forEach((v, id) => {
        if (v.total <= 1 && v.indexes.length === 1) return;
        v.indexes.forEach((i) => removeIndexes.push(i));
      });

      removeIndexes.sort((a, b) => b - a);
      for (const i of removeIndexes) await ecwidRemoveIndex(i);

      for (const [id, info] of byId.entries()) {
        if (info.total >= 1) await ecwidAddProduct(id, 1);
      }
    } finally {
      state.syncing = false;
    }
  }

  async function addSelectedToCart() {
    const selected = state.assigned.filter((x) => state.selectedIds.has(x.id) && !state.lockedIds.has(x.id));
    if (!selected.length) return;

    setStatus("Adding selected stoles to cart...", "ok");
    for (const item of selected) {
      await ecwidAddProduct(item.id, 1);
    }
    await enforceCartRules();
    await readLockedFromCart();
    renderRows();
    setStatus("Selected stoles added. Items already in cart are now locked.", "ok");
  }

  async function loginFlow() {
    try {
      const sNum = normalizeS(els.input.value);
      if (!sNum) { setStatus("Enter your S-number.", "error"); return; }

      setStatus("Loading your stole options...", "");
      state.sNumber = sNum;

      if (!state.catalog.length) await fetchCatalog();
      state.assigned = resolveAssigned(sNum);

      if (!state.assigned.length) {
        els.main.style.display = "none";
        setStatus("No stole found for you please contact your counselor.", "error");
        return;
      }

      await whenEcwidReady();
      await enforceCartRules();
      await readLockedFromCart();
      renderRows();

      els.main.style.display = "";
      setStatus(`Loaded ${state.assigned.length} eligible stole(s).`, "ok");
    } catch (err) {
      console.error(err);
      setStatus(`Could not load stoles: ${err.message}`, "error");
    }
  }

  els.loginBtn.addEventListener("click", loginFlow);
  els.input.addEventListener("keydown", (e) => { if (e.key === "Enter") loginFlow(); });
  els.addBtn.addEventListener("click", () => addSelectedToCart().catch((e) => setStatus(e.message, "error")));

  whenEcwidReady()
    .then(() => {
      if (window.Ecwid && Ecwid.OnCartChanged && typeof Ecwid.OnCartChanged.add === "function") {
        Ecwid.OnCartChanged.add(() => {
          if (!state.assigned.length) return;
          enforceCartRules()
            .then(readLockedFromCart)
            .then(renderRows)
            .catch((e) => console.warn("[stole-app] cart sync warning", e));
        });
      }
    })
    .catch(() => {});
})();
</script>
